<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda SQL en GitHub</title>
   
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    
    <div id="seccion-auth">
        <h2>Iniciar Sesión o Registrarse</h2>
        <p id="mensaje-auth" style="color: red;"></p>

        <label>Correo electrónico:</label><br>
        <input type="email" id="email" placeholder="correo@ejemplo.com"><br><br>

        <label>Contraseña (mínimo 6 caracteres):</label><br>
        <input type="password" id="password"><br><br>

        <button onclick="iniciarSesion()">Iniciar Sesión</button>
        <button onclick="registrarse()">Registrarse</button>
    </div>

    <!-- SECCIÓN 2: TIENDA Y FORMULARIO (Visible al iniciar sesión) -->
    <div id="seccion-tienda" style="display: none;">
        <p>Bienvenido: <b id="usuario-actual"></b> | <button onclick="cerrarSesion()">Cerrar Sesión</button></p>
        <hr>

        <h2>Formulario de Venta / Pedido</h2>
        <p id="mensaje-pedido" style="color: green;"></p>

        <form id="form-pedido" onsubmit="guardarPedido(event)">
            <label>1. Categoría:</label><br>
            <select id="categoria" onchange="actualizarMarcas()" required>
                <option value="">-- Seleccione --</option>
                <option value="Ropa">Ropa</option>
                <option value="Cosmeticos">Cosméticos</option>
                <option value="Calzado">Calzado</option>
                <option value="Celulares">Celulares</option>
            </select><br><br>

            <label>2. Marca:</label><br>
            <select id="marca" required>
                <option value="">-- Primero elija una categoría --</option>
            </select><br><br>

            <label>3. Producto / Modelo:</label><br>
            <input type="text" id="producto" required><br><br>

            <label>4. Cantidad:</label><br>
            <input type="number" id="cantidad" min="1" value="1" required><br><br>

            <button type="submit">Registrar Venta en SQL</button>
        </form>

        <hr>
        <h3>Mis Pedidos Guardados</h3>
        <table border="1" cellpadding="5">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Categoría</th>
                    <th>Marca</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody id="tabla-pedidos"></tbody>
        </table>
    </div>

    <script>
        
        const SUPABASE_URL = 'https://isadyyacupazlstbzeid.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_Atc2ENSKXs-5S_91rZVYXg_3J1ilxSl';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Marcas dinámicas por categoría
        const marcasPorCategoria = {
            "Ropa": ["Zara", "H&M", "Levi's", "Nike", "Gucci"],
            "Cosmeticos": ["L'Oréal", "MAC", "Maybelline", "Sephora", "Nivea"],
            "Calzado": ["Adidas", "Nike", "Puma", "Converse", "Vans"],
            "Celulares": ["Apple", "Samsung", "Xiaomi", "Motorola", "Huawei"]
        };

        function actualizarMarcas() {
            const cat = document.getElementById("categoria").value;
            const marcaSelect = document.getElementById("marca");
            marcaSelect.innerHTML = '<option value="">-- Seleccione Marca --</option>';

            if (cat && marcasPorCategoria[cat]) {
                marcasPorCategoria[cat].forEach(marca => {
                    const op = document.createElement("option");
                    op.value = marca;
                    op.textContent = marca;
                    marcaSelect.appendChild(op);
                });
            }
        }

        // 2. FUNCIONES DE REGISTRO Y LOGIN
        async function registrarse() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const { error } = await db.auth.signUp({ email, password });

            if (error) {
                document.getElementById("mensaje-auth").innerText = "Error: " + error.message;
            } else {
                document.getElementById("mensaje-auth").style.color = "green";
                document.getElementById("mensaje-auth").innerText = "Registro exitoso. Ahora haz clic en Iniciar Sesión.";
            }
        }

        async function iniciarSesion() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById("mensaje-auth").style.color = "red";
                document.getElementById("mensaje-auth").innerText = "Error: " + error.message;
            } else {
                verificarSesion();
            }
        }

        async function cerrarSesion() {
            await db.auth.signOut();
            verificarSesion();
        }

        async function verificarSesion() {
            const { data: { user } } = await db.auth.getUser();
            if (user) {
                document.getElementById("seccion-auth").style.display = "none";
                document.getElementById("seccion-tienda").style.display = "block";
                document.getElementById("usuario-actual").innerText = user.email;
                cargarPedidos(user.email);
            } else {
                document.getElementById("seccion-auth").style.display = "block";
                document.getElementById("seccion-tienda").style.display = "none";
            }
        }

        // 3. GUARDAR Y LEER DATOS EN SQL
        async function guardarPedido(e) {
            e.preventDefault();
            const { data: { user } } = await db.auth.getUser();

            const nuevoPedido = {
                usuario_email: user.email,
                categoria: document.getElementById("categoria").value,
                marca: document.getElementById("marca").value,
                producto: document.getElementById("producto").value,
                cantidad: parseInt(document.getElementById("cantidad").value)
            };

            const { error } = await db.from('pedidos').insert([nuevoPedido]);

            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                document.getElementById("mensaje-pedido").innerText = "¡Pedido guardado en SQL!";
                document.getElementById("form-pedido").reset();
                cargarPedidos(user.email);
            }
        }

        async function cargarPedidos(email) {
            const { data, error } = await db
                .from('pedidos')
                .select('*')
                .eq('usuario_email', email)
                .order('id', { ascending: false });

            const tbody = document.getElementById("tabla-pedidos");
            tbody.innerHTML = "";

            if (data) {
                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.categoria}</td>
                            <td>${p.marca}</td>
                            <td>${p.producto}</td>
                            <td>${p.cantidad}</td>
                        </tr>`;
                });
            }
        }

        
        verificarSesion();
    </script>
</body>
</html>
